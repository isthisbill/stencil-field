/* Layout: a control rail on the left, the painting hung on a wall to the right */
:root {
  --wall: #e4e3df;
  --panel: #f7f6f3;
  --ink: #1e1c1a;
  --muted: #6d6963;
  --rule: #d9d6cf;
  --accent: #d6431d;
  --chip: #ecebe6;
  --ui: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --display: "Knewave", "Arial Black", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --wall: #1b1a19; --panel: #232220; --ink: #ecebe7; --muted: #9a958d;
    --rule: #393633; --accent: #f06a3e; --chip: #2e2c29; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --wall: #1b1a19; --panel: #232220; --ink: #ecebe7; --muted: #9a958d;
  --rule: #393633; --accent: #f06a3e; --chip: #2e2c29; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--wall); color: var(--ink); font-family: var(--ui); font-size: 14px; overscroll-behavior: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }

.app { display: grid; grid-template-columns: 330px minmax(0, 1fr); height: 100%; }
.rail { background: var(--panel); border-right: 1px solid var(--rule); overflow-y: auto; padding: 18px 18px 48px; min-width: 0; }
.stage { display: grid; place-items: center; padding: 28px; min-width: 0; min-height: 0; overflow: hidden; }
#art { display: block; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 12px 40px rgba(0,0,0,.12); }

.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
.brand h1 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0; letter-spacing: -.01em; line-height: 1; }
.brand h1 span { color: var(--accent); }
.brand small { color: var(--muted); font-family: var(--mono); font-size: 11px; }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
button, select, textarea, input[type="number"] { font: inherit; color: var(--ink); }
.btn { border: 1px solid var(--rule); background: var(--chip); border-radius: 6px; padding: 8px 10px; cursor: pointer; font-weight: 600; letter-spacing: .02em; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.row2 { display: grid; grid-template-columns: 1fr 104px; gap: 8px; margin-bottom: 6px; }
select, input[type="number"], textarea { width: 100%; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px; min-width: 0; }
input[type="number"] { font-family: var(--mono); font-size: 12px; }
textarea { font-family: var(--mono); font-size: 13px; resize: vertical; min-height: 54px; text-transform: none; }

details { border-top: 1px solid var(--rule); padding: 10px 0 4px; }
summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); padding-bottom: 8px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font-family: var(--mono); font-size: 14px; }
details[open] summary::after { content: "–"; }
.group { display: grid; gap: 10px; padding-bottom: 10px; }

.ctl { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 8px; align-items: center; }
.ctl label { font-size: 13.5px; }
.ctl output { font-family: var(--mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ctl input[type="range"], .ctl select, .ctl textarea { grid-column: 1 / -1; }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 2px 0; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13.5px; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.fontrow { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0,1fr) 108px; gap: 8px; }
.fontother { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; margin-top: 6px; }
.fontother input { width: 100%; min-width: 0; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px; }
.fontother .btn { padding: 6px 14px; }
.hint.bad { color: var(--accent); }
.seg { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 8px 4px; font: inherit; font-weight: 600; font-size: 12.5px; color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--chip); color: var(--ink); }
.seg i { display: block; border: 1.5px solid currentColor; border-radius: 2px; }
.seg i.portrait { width: 11px; height: 15px; } .seg i.square { width: 13px; height: 13px; } .seg i.landscape { width: 16px; height: 11px; }
.hint { font-size: 12px; color: var(--muted); margin: -4px 0 0; line-height: 1.35; }

.colors { display: grid; gap: 6px; }
.swatch { display: grid; grid-template-columns: 40px minmax(0,1fr) 28px; gap: 10px; align-items: center; min-height: 40px; }
/* Color pickers: the real input is stretched invisibly over a big swatch, so any tap on it opens the picker */
.chip { position: relative; width: 40px; height: 34px; border-radius: 7px; border: 1px solid var(--rule); background: var(--c, #ccc); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); }
.chip input[type="color"], .colorrow > input[type="color"] { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; border: 0; opacity: 0; cursor: pointer; }
.chip:focus-within, .colorrow:focus-within .chip { outline: 2px solid var(--accent); outline-offset: 2px; }
.colorrow { position: relative; border-radius: 8px; cursor: pointer; }
.colorrow:hover .chip { border-color: var(--muted); }
.colorrow span:not(.chip) { font-size: 13.5px; }
.colorrow code { justify-self: end; }
.swatch code { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.x { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 0; width: 100%; height: 36px; border-radius: 6px; }
.x:hover { color: var(--accent); }
.add { justify-self: start; border: 1px dashed var(--rule); background: none; border-radius: 6px; padding: 4px 10px; cursor: pointer; color: var(--muted); font-size: 12.5px; }
.add:hover { color: var(--ink); border-color: var(--muted); }

.orients { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.orients .ctl label { display: flex; gap: 6px; align-items: center; }
.glyph { font-family: var(--display); font-size: 13px; display: inline-block; width: 18px; text-align: center; color: var(--accent); }

.modal { position: fixed; inset: 0; background: rgba(10,10,10,.6); display: grid; place-items: center; padding: 16px; z-index: 10; }
.sheet { background: var(--panel); border-radius: 10px; padding: 16px; max-width: min(720px, 100%); max-height: 100%; overflow: auto; display: grid; gap: 12px; }
.sheet img { max-height: 62vh; width: auto; margin: 0 auto; display: block; box-shadow: 0 6px 24px rgba(0,0,0,.2); }
.sheet p { margin: 0; color: var(--muted); font-size: 13px; }
.sheet .bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.sheet a.btn { text-decoration: none; }

/* Touch screens (iPad): bigger targets, no keyboard hint */
@media (pointer: coarse) {
  .brand small { display: none; }
  .group { gap: 14px; }
  input[type="range"] { height: 30px; }
  input[type="range"]::-webkit-slider-thumb { width: 26px; height: 26px; }
  .btn { padding: 11px 12px; }
  .check input { width: 22px; height: 22px; }
  .chip { width: 52px; height: 44px; }
  .swatch { grid-template-columns: 52px minmax(0,1fr) 36px; min-height: 48px; }
  .x { font-size: 22px; }
  select, input[type="number"], .fontother input { padding: 9px 10px; }
  .seg button { padding: 12px 4px; }
}
@media (min-width: 701px) and (max-width: 900px) { .app { grid-template-columns: 290px minmax(0, 1fr); } .stage { padding: 18px; } }

@media (max-width: 700px) {
  .app { grid-template-columns: minmax(0,1fr); height: auto; }
  .stage { order: -1; padding: 16px; }
  .rail { border-right: 0; border-top: 1px solid var(--rule); overflow: visible; padding-inline: 16px; }
}
</style>

<div class="app">
  <aside class="rail" id="rail">
    <div class="brand"><h1>Stencil <span>Field</span></h1><small>press R to reshuffle</small></div>
    <div class="actions">
      <button class="btn" id="shuffle" type="button">Reshuffle</button>
      <button class="btn primary" id="export" type="button">Export PNG</button>
    </div>
    <div class="row2">
      <select id="preset" aria-label="Preset"></select>
      <input id="seed" type="number" aria-label="Seed" title="Seed: the same seed and settings always give the same layout">
    </div>
    <div id="panel"></div>
  </aside>
  <main class="stage" id="stage"><canvas id="art" aria-label="Generated stencil composition"></canvas></main>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet">
    <img id="outImg" alt="Exported composition">
    <p id="saveHint">Right-click or long-press the image to save it. If you opened this file locally, Download also works.</p>
    <div class="bar">
      <select id="exScale" aria-label="Export size" style="width:auto">
        <option value="2">2000 px tall</option>
        <option value="4" selected>4000 px tall</option>
        <option value="6">6000 px tall</option>

      <button class="btn" id="copySettings" type="button">Copy settings</button>
      <button class="btn" id="share" type="button" hidden>Share / Save…</button>
      <a class="btn" id="dl" download="stencil-field.png" href="#">Download</a>
      <button class="btn primary" id="closeModal" type="button">Close</button>
    </div>
  </div>
</div>

/* ---------- utilities ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function pickW(arr, u, wf){let tot=0;for(const a of arr)tot+=Math.max(0,wf(a));if(tot<=0)return arr[0];let x=u*tot;for(const a of arr){x-=Math.max(0,wf(a));if(x<=0)return a}return arr[arr.length-1]}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
const deg = d => d*Math.PI/180;
const clone = o => JSON.parse(JSON.stringify(o));

  try { const s = JSON.parse(localStorage.getItem("stencil-field-v5")); if (s) return Object.assign(clone(BASE), s); } catch(e) {}
  return clone(BASE);
}

/* ---------- measurement ---------- */
const mctx = document.createElement("canvas").getContext("2d");
const mcache = new Map();
const fontStr = fs => `${S.fontWeight} ${fs}px "${S.font}", sans-serif`;
function measure(word){
  const key = S.font+"|"+S.fontWeight+"|"+word;
  if (mcache.has(key)) return mcache.get(key);
  mctx.font = fontStr(100);
  const widths = [...word].map(ch => mctx.measureText(ch).width);
  mcache.set(key, widths); return widths;
}
const wordWidth100 = w => { const ws = measure(w); return ws.reduce((a,b)=>a+b,0) + S.tracking*100*(ws.length-1); };

/* ---------- geometry ---------- */
function frame(){ const m = S.margin?60:0, pw = 1000*S.aspect, ph = 1000; return {W:pw+2*m, H:ph+2*m, px:m, py:m, pw, ph}; }

/* ---------- brush texture ---------- */
const patCache = new WeakMap();
function paint(ctx, color){
  if (S.brush < 0.02) return color;
  let m = patCache.get(ctx); if (!m) { m = new Map(); patCache.set(ctx, m); }
  const key = color+"|"+S.brush.toFixed(2);
  if (m.has(key)) return m.get(key);
  const N = 180, c = document.createElement("canvas"); c.width = c.height = N;
  const g = c.getContext("2d"), r = mulberry32(hashStr(color));
  g.fillStyle = color; g.fillRect(0,0,N,N);
  const streak = (fill, a) => { const x=r()*N, y=r()*N, w=1+r()*3.5, h=10+r()*55; g.globalAlpha=a; g.fillStyle=fill;
    for (const dx of [0,-N]) for (const dy of [0,-N]) g.fillRect(x+dx,y+dy,w,h); };
  g.globalCompositeOperation = "destination-out";
  for (let i=0;i<260;i++) streak("#000", r()*0.42*S.brush);
  g.globalCompositeOperation = "source-over";
  for (let i=0;i<90;i++) streak("#fff", r()*0.14*S.brush);
  for (let i=0;i<60;i++) streak("#000", r()*0.08*S.brush);
  const p = ctx.createPattern(c, "repeat"); m.set(key, p); return p;
}

/* ---------- composition ---------- */
const ORIENTS = [
  {k:"oNormal", rot:0, sx:1, sy:1},
  {k:"oMirror", rot:0, sx:-1, sy:1},
  {k:"oFlip", rot:0, sx:1, sy:-1},
  {k:"oRot180", rot:Math.PI, sx:1, sy:1},
];

function buildItems(F){
  const items = [];
  const words = S.words.toUpperCase().split(/[\s,]+/).filter(Boolean);
  if (!words.length) return items;
  const pal = S.palette.length ? S.palette : [{c:"#ffffff",w:1}];
  const rW = mulberry32(S.seed);
  const pad = S.padding*Math.min(F.pw,F.ph);
  const A = {x:F.px+pad, y:F.py+pad, w:F.pw-2*pad, h:F.ph-2*pad};
  const colW = A.w/S.columns, rowH = A.h/S.perColumn;
  // One type size for every word, set by the longest word filling the column
  const fs = 100*colW*S.size/(Math.max(...words.map(wordWidth100))*S.squeeze);
  // Stacking rule: neighbours in a column are "the same" when they match on every checked aspect
  const keys = [S.ruleColor&&"color", S.ruleStyle&&"solid", S.ruleOrient&&"o", S.ruleWord&&"word"].filter(Boolean);
  const same = (a,b) => keys.every(k => a[k]===b[k]);
  const treat = u => ({ word: words[Math.floor(u[0]*words.length)], o: pickW(ORIENTS,u[1],o=>S[o.k]), solid: u[2] < S.solid, color: pickW(pal,u[3],a=>a.w).c });
  for (let c=0;c<S.columns;c++){
    const slots = [];
    for (let p=0;p<S.passes;p++){
      const off = (p/S.passes)*rowH;
      for (let i=0;i<S.perColumn;i++){
        const R = Array.from({length:14}, rW);
        const x = A.x+(c+.5)*colW+(R[4]-.5)*S.jitterX*colW;
        let y = A.y+(i+.5)*rowH+off+(R[5]-.5)*S.jitterY*rowH;
        if (y > A.y+A.h) y -= A.h;
        slots.push({x, y, R});
      }
    }
    slots.sort((a,b)=>a.y-b.y);
    const hist = [];
    for (const {x, y, R} of slots){
      let t = treat(R), tries = 0;
      const rr = mulberry32(Math.floor(R[13]*1e9));
      while (keys.length && hist.some(h=>same(h,t)) && tries++ < 40) t = treat([rr(),rr(),rr(),rr()]);
      hist.push(t); if (hist.length > S.ruleDepth) hist.shift();
      items.push({ word:t.word, fs, x, y, rot:t.o.rot, sx:t.o.sx, sy:t.o.sy, solid:t.solid, color:t.color,
        op: S.opMin+R[12]*Math.max(0,S.opMax-S.opMin), lseed: Math.floor(R[11]*1e9), z: R[6] + (t.solid?0:S.outlineTop) });
    }
  }
  return items.sort((a,b)=>a.z-b.z);
}

function drawGround(ctx, F){
  const r = mulberry32(S.seed ^ 0x51ed270b);
  const {px,py,pw,ph} = F;
  ctx.fillStyle = S.bg; ctx.fillRect(px,py,pw,ph);
  for (let i=0;i<Math.round(160*S.mottle);i++){
    const x=px+r()*pw, y=py+r()*ph, rad=30+r()*170, light=r()<.5;
    const g = ctx.createRadialGradient(x,y,0,x,y,rad);
    g.addColorStop(0, light?`rgba(255,255,255,${.07*S.mottle})`:`rgba(0,0,0,${.06*S.mottle})`);
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g; ctx.fillRect(x-rad,y-rad,rad*2,rad*2);
  }
  const band = 0.1*Math.min(pw,ph);
  const grads = [[px,py,px,py+band*.6],[px,py+ph,px,py+ph-band*.6],[px,py,px+band*.6,py],[px+pw,py,px+pw-band*.6,py]];
  for (const [x0,y0,x1,y1] of grads){
    const g = ctx.createLinearGradient(x0,y0,x1,y1);
    g.addColorStop(0, rgba(S.edge, .75*S.vignette)); g.addColorStop(1, rgba(S.edge, 0));
    ctx.fillStyle = g; ctx.fillRect(px,py,pw,ph);
  }
  ctx.fillStyle = S.edge;
  for (let i=0;i<Math.round(1800*S.vignette);i++){
    const side=Math.floor(r()*4), d=Math.pow(r(),2.2)*band, len=8+r()*60, th=1.5+r()*6;
    ctx.globalAlpha = (1-d/band)*0.32*r();
    if (side===0) ctx.fillRect(px+r()*pw, py+d, len, th);
    else if (side===1) ctx.fillRect(px+r()*pw, py+ph-d-th, len, th);
    else if (side===2) ctx.fillRect(px+d, py+r()*ph, th, len);
    else ctx.fillRect(px+pw-d-th, py+r()*ph, th, len);
  }
  ctx.globalAlpha = 1;
}

const mask = document.createElement("canvas"), mk = mask.getContext("2d", { willReadFrequently: true });
function drawWord(ctx, it){
  const ws = measure(it.word), k = it.fs/100, tr = S.tracking*it.fs;
  const total = ws.reduce((a,b)=>a+b,0)*k + tr*(ws.length-1);
  let cx = -total/2;
  const glyphs = [...it.word].map((ch,i) => { const w = ws[i]*k, g = { ch, cx: cx+w/2 }; cx += w+tr; return g; });

  ctx.save();
  ctx.translate(it.x, it.y); ctx.rotate(it.rot); ctx.scale(it.sx*S.squeeze, it.sy);
  ctx.globalAlpha = it.op;

  // Each word is built as a pixel mask at output resolution, then placed in one step
  const m = ctx.getTransform(), res = Math.max(1, Math.sqrt(Math.abs(m.a*m.d - m.b*m.c)));
  const puff = it.solid ? S.blob*it.fs : 0;
  const pad = it.fs*.3 + puff, W = total+2*pad, H = it.fs*1.6 + 2*puff;
  const pw = Math.ceil(W*res), ph = Math.ceil(H*res), n = pw*ph;
  mask.width = pw; mask.height = ph;
  const local = () => mk.setTransform(res,0,0,res,W/2*res,H/2*res);
  local();
  mk.font = fontStr(it.fs); mk.textAlign = "center"; mk.textBaseline = "middle";
  mk.lineJoin = "round"; mk.fillStyle = mk.strokeStyle = "#000"; mk.lineWidth = puff;
  for (const g of glyphs){ if (puff > 0.01) mk.strokeText(g.ch, g.cx, 0); mk.fillText(g.ch, g.cx, 0); }

  const img = mk.getImageData(0,0,pw,ph), px = img.data;
  // Flood the background in from the edges; any empty pixel it can't reach is a counter
  const ext = new Uint8Array(n), stack = new Int32Array(n); let sp = 0;
  const seed = i => { if (!ext[i] && px[i*4+3] < 128){ ext[i] = 1; stack[sp++] = i; } };
  for (let x=0;x<pw;x++){ seed(x); seed((ph-1)*pw+x); }
  for (let y=0;y<ph;y++){ seed(y*pw); seed(y*pw+pw-1); }
  while (sp){ const i = stack[--sp], x = i%pw;
    if (x>0) seed(i-1); if (x<pw-1) seed(i+1); if (i>=pw) seed(i-pw); if (i<n-pw) seed(i+pw); }
  const A = new Float32Array(n);
  for (let i=0;i<n;i++) A[i] = S.counters ? (ext[i] ? px[i*4+3] : 255) : px[i*4+3];

  if (!it.solid){
    // Inside stroke: keep only pixels within the outline weight of the shape's edge (chamfer distance)
    const INF = 1e9, d = new Float32Array(n);
    for (let i=0;i<n;i++) d[i] = (S.counters ? !ext[i] : px[i*4+3] >= 128) ? INF : 0;
    for (let y=0;y<ph;y++) for (let x=0;x<pw;x++){ const i=y*pw+x; if (!d[i]) continue; let v=d[i];
      if (x>0) v=Math.min(v,d[i-1]+3); if (y>0){ v=Math.min(v,d[i-pw]+3); if (x>0) v=Math.min(v,d[i-pw-1]+4); if (x<pw-1) v=Math.min(v,d[i-pw+1]+4); } d[i]=v; }
    for (let y=ph-1;y>=0;y--) for (let x=pw-1;x>=0;x--){ const i=y*pw+x; if (!d[i]) continue; let v=d[i];
      if (x<pw-1) v=Math.min(v,d[i+1]+3); if (y<ph-1){ v=Math.min(v,d[i+pw]+3); if (x<pw-1) v=Math.min(v,d[i+pw+1]+4); if (x>0) v=Math.min(v,d[i+pw-1]+4); } d[i]=v; }
    const w = S.strokeW*res;
    for (let i=0;i<n;i++) if (d[i]) A[i] *= Math.min(1, Math.max(0, w - d[i]/3 + .5));
  }
  const rgb = parseInt(it.color.slice(1),16);
  for (let i=0;i<n;i++){ px[i*4]=rgb>>16&255; px[i*4+1]=rgb>>8&255; px[i*4+2]=rgb&255; px[i*4+3]=A[i]; }
  mk.setTransform(1,0,0,1,0,0); mk.putImageData(img,0,0);
  if (it.solid && S.brush >= 0.02){
    // Solid: apply the brush texture once over the finished silhouette
    local(); mk.globalCompositeOperation = "source-in";
    mk.fillStyle = paint(mk, it.color); mk.fillRect(-W/2,-H/2,W,H);
    mk.globalCompositeOperation = "source-over";
  }
  ctx.drawImage(mask, -W/2, -H/2, W, H);
  ctx.restore();
}

function render(ctx){
  const F = frame();
  ctx.fillStyle = "#f2f1ee"; ctx.fillRect(0,0,F.W,F.H);
  ctx.save(); ctx.beginPath(); ctx.rect(F.px,F.py,F.pw,F.ph); ctx.clip();
  drawGround(ctx, F);
  for (const it of buildItems(F)) drawWord(ctx,it);
  ctx.restore();
}

/* ---------- preview ---------- */
const canvas = document.getElementById("art"), stage = document.getElementById("stage");
let raf = 0;
function schedule(){ if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); }
function draw(){
  const F = frame(), b = stage.getBoundingClientRect();
  const cs = getComputedStyle(stage), padX = parseFloat(cs.paddingLeft)*2, padY = parseFloat(cs.paddingTop)*2;
  const narrow = matchMedia("(max-width: 700px)").matches;
  const s = narrow ? (b.width-padX)/F.W : Math.min((b.width-padX)/F.W, (b.height-padY)/F.H);
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = (F.W*s)+"px"; canvas.style.height = (F.H*s)+"px";
  canvas.width = Math.round(F.W*s*dpr); canvas.height = Math.round(F.H*s*dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(s*dpr,0,0,s*dpr,0,0);
  render(ctx);
}
const loaded = new Set(), failed = new Set(), linked = new Map();
function linkFont(family, weight){
  if (family === "Knewave" && weight == 400) return Promise.resolve(true);
  const key = family+"|"+weight;
  if (!linked.has(key)) linked.set(key, new Promise(res => {
    const l = document.createElement("link"); l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?family=" + encodeURIComponent(family).replace(/%20/g,"+") + (weight != 400 ? ":wght@"+weight : "") + "&display=block";
    l.onload = () => res(true); l.onerror = () => { l.remove(); linked.delete(key); res(false); };
    document.head.append(l);
  }));
  return linked.get(key);
}
function fontStatus(text, bad){ const p = document.getElementById("fontStatus"); if (p){ p.textContent = text; p.classList.toggle("bad", !!bad); } }
async function ensureFont(){
  const key = S.font+"|"+S.fontWeight;
  if (loaded.has(key) || failed.has(key)) return;
  if (S.font !== "Knewave") fontStatus(`Loading ${S.font}…`);
  const ok = await linkFont(S.font, S.fontWeight);
  let faces = [];
  if (ok) { try { await document.fonts.ready; faces = await document.fonts.load(fontStr(100), "EASYMORENOW"); } catch(e) {} }
  if (key !== S.font+"|"+S.fontWeight) return;   // the choice changed while this was loading
  if (!faces.length){
    failed.add(key);
    const w = WEIGHTS.find(x => x[0] == S.fontWeight);
    return fontStatus(`Couldn't load "${S.font}"${S.fontWeight != 400 ? " in "+w[1] : ""}. Check the name matches fonts.google.com exactly, try another weight, or check your internet connection.`, true);
  }
  loaded.add(key); mcache.clear(); schedule();
  fontStatus(S.font === "Knewave" && S.fontWeight == 400 ? "Built in, works offline." : `${S.font} loaded from Google Fonts. Needs internet the first time.`);
}
function setFont(family, weight){ S.font = family; S.fontWeight = weight; failed.delete(family+"|"+weight); changed(); }
function changed(){ save(); ensureFont(); schedule(); }

const el = (tag, props={}, kids=[]) => { const e = Object.assign(document.createElement(tag), props); kids.forEach(k=>e.append(k)); return e; };

function control(spec){
  if (spec.type === "font") return fontUI();
  if (spec.type === "format") return formatUI();
  if (spec.type === "note") return el("p", {className:"hint", textContent:spec.text, style:"margin:0"});
  const id = "c-"+spec.k;
  if (spec.type === "check"){
    const inp = el("input", {type:"checkbox", id, checked: !!S[spec.k]});
    inp.addEventListener("change", () => { S[spec.k] = inp.checked; changed(); });
    return el("label", {className:"check", htmlFor:id}, [inp, spec.label]);
  }
  const wrap = el("div", {className:"ctl"});
  const lab = el("label", {htmlFor:id, textContent:spec.label});
  if (spec.type === "textarea"){
    const t = el("textarea", {id, value:S[spec.k], rows:2, spellcheck:false});
    t.addEventListener("input", () => { S[spec.k] = t.value; changed(); });
    wrap.append(lab, el("span"), t);
    if (spec.hint) wrap.append(el("p", {className:"hint", textContent:spec.hint, style:"grid-column:1/-1;margin-top:4px"}));
    return wrap;
  }
  if (spec.type === "select"){
    const s = el("select", {id}); spec.options.forEach(o => s.append(el("option", {value:o, textContent:o})));
    s.value = S[spec.k]; s.addEventListener("change", () => { S[spec.k] = s.value; changed(); });
    wrap.append(lab, el("span"), s); return wrap;
  }
  if (spec.type === "color"){
    // The whole row is the tap target: the color input covers it invisibly
    const chip = el("span", {className:"chip"}); chip.style.setProperty("--c", S[spec.k]);
    const code = el("code", {textContent:S[spec.k]});
    const c = el("input", {type:"color", id, value:S[spec.k], ariaLabel:spec.label});
    const set = () => { S[spec.k] = c.value; code.textContent = c.value; chip.style.setProperty("--c", c.value); changed(); };
    c.addEventListener("input", set); c.addEventListener("change", set);
    return el("div", {className:"swatch colorrow"}, [chip, el("span", {textContent:spec.label}), code, c]);
  }
  const out = el("output", {htmlFor:id});
  const fmt = spec.fmt || (v=>v);
  const r = el("input", {type:"range", id, min:spec.min, max:spec.max, step:spec.step, value:S[spec.k]});
  out.textContent = fmt(S[spec.k]);
  r.addEventListener("input", () => { S[spec.k] = +r.value; out.textContent = fmt(+r.value); changed(); });
  wrap.append(lab, out, r); return wrap;
}

function orientsUI(){
  const labels = { oNormal:"Straight", oMirror:"Mirrored", oFlip:"Flipped", oRot180:"Rotated 180°" };
  const tf = { oNormal:"", oMirror:"scaleX(-1)", oFlip:"scaleY(-1)", oRot180:"rotate(180deg)" };
  const box = el("div", {className:"orients"});
  for (const o of ORIENTS){
    const c = control({k:o.k, label:labels[o.k], min:0, max:10, step:.5});
    const g = el("span", {className:"glyph", textContent:"R", style:`transform:${tf[o.k]}`});
    c.querySelector("label").prepend(g); box.append(c);
  }
  return [box, el("p", {className:"hint", textContent:"Each slider is a weight. Zero turns that orientation off."})];
}

function colorList(key, weighted){
  const box = el("div", {className:"colors"});
  const paint = () => {
    box.replaceChildren();
    S[key].forEach((entry, i) => {
      const hex = weighted ? entry.c : entry;
      const c = el("input", {type:"color", value:hex, id:`${key}-${i}`, ariaLabel:`Color ${i+1}`});
      const chip = el("span", {className:"chip"}, [c]); chip.style.setProperty("--c", hex);
      const set = () => { if (weighted) S[key][i].c = c.value; else S[key][i] = c.value; chip.style.setProperty("--c", c.value); changed(); };
      c.addEventListener("input", set); c.addEventListener("change", set);
      const x = el("button", {className:"x", type:"button", textContent:"×", ariaLabel:"Remove color", title:"Remove"});
      x.addEventListener("click", () => { S[key].splice(i,1); paint(); changed(); });
      let mid;
      if (weighted){
        mid = el("input", {type:"range", min:0, max:10, step:.1, value:entry.w, title:"How often this color is used", ariaLabel:`Color ${i+1} amount`});
        mid.addEventListener("input", () => { S[key][i].w = +mid.value; changed(); });
      } else mid = el("code", {textContent:hex});
      box.append(el("div", {className:"swatch"}, [chip, mid, x]));
    });
    const add = el("button", {className:"add", type:"button", textContent:"+ Add color"});
    add.addEventListener("click", () => { const h = "#"+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,"0"); S[key].push(weighted?{c:h,w:3}:h); paint(); changed(); });
    box.append(add);
  };
  paint(); return box;
}

function fontUI(){
  const known = FONT_LIST.some(f => f[0] === S.font);
  const sel = el("select", {id:"c-font"});
  FONT_LIST.forEach(([f]) => sel.append(el("option", {value:f, textContent: f === "Knewave" ? "Knewave (built in)" : f})));
  sel.append(el("option", {value:"__other", textContent:"Other Google font…"}));
  sel.value = known ? S.font : "__other";
  const wt = el("select", {id:"c-fontWeight", ariaLabel:"Weight"});
  WEIGHTS.forEach(([v,n]) => wt.append(el("option", {value:v, textContent:n})));
  wt.value = S.fontWeight;
  const name = el("input", {type:"text", id:"c-fontOther", value: known ? "" : S.font, placeholder:"Name as on fonts.google.com", autocapitalize:"words", spellcheck:false});
  const go = el("button", {className:"btn", type:"button", textContent:"Load"});
  const other = el("div", {className:"fontother", hidden: known}, [name, go]);
  const loadOther = () => { const v = name.value.trim().replace(/\s+/g," "); if (v) setFont(v, +wt.value); };
  sel.addEventListener("change", () => {
    if (sel.value === "__other"){ other.hidden = false; name.focus(); return; }
    other.hidden = true; wt.value = FONT_LIST.find(f => f[0] === sel.value)[1]; setFont(sel.value, +wt.value);
  });
  wt.addEventListener("change", () => setFont(S.font, +wt.value));
  go.addEventListener("click", loadOther);
  name.addEventListener("keydown", e => { if (e.key === "Enter") loadOther(); });
  const status = el("p", {className:"hint", id:"fontStatus", style:"grid-column:1/-1;margin:2px 0 0"});
  const wrap = el("div", {className:"ctl"}, [el("label", {htmlFor:"c-font", textContent:"Typeface"}), el("span"),
    el("div", {className:"fontrow"}, [sel, wt]), other, status]);
  return wrap;
}

function formatUI(){
  const kind = S.aspect < .95 ? "portrait" : S.aspect > 1.05 ? "landscape" : "square";
  const seg = el("div", {className:"seg", role:"group", ariaLabel:"Canvas format"});
  for (const [k, label] of [["portrait","Portrait"],["square","Square"],["landscape","Landscape"]]){
    const b = el("button", {type:"button"}, [el("i", {className:k}), label]);
    b.setAttribute("aria-pressed", k === kind);
    b.addEventListener("click", () => setFormat(k));
    seg.append(b);
  }
  return el("div", {className:"ctl"}, [el("label", {textContent:"Format"}), el("span"), seg]);
}
function setFormat(kind){
  const old = S.aspect, long = Math.max(old, 1/old), r = long < 1.05 ? 1/0.7 : long;
  const a = kind === "portrait" ? 1/r : kind === "landscape" ? r : 1;
  if (Math.abs(a-old) < .005) return;
  // Height stays fixed, so scale the column count with the width to keep words the same size
  S.columns = Math.max(1, Math.min(12, Math.round(S.columns*a/old)));
  S.aspect = +a.toFixed(2); buildPanel(); changed();
}

function buildPanel(){
  const panel = document.getElementById("panel");
  const wasOpen = new Map([...panel.querySelectorAll("details")].map(d => [d.dataset.g, d.open]));
  panel.replaceChildren();
  for (const g of GROUPS){
    const d = el("details", {open: wasOpen.has(g.title) ? wasOpen.get(g.title) : g.open}); d.dataset.g = g.title; d.append(el("summary", {textContent:g.title}));
    const body = el("div", {className:"group"});
    (g.items||[]).forEach(s => body.append(control(s)));
    if (g.custom === "orients") body.append(...orientsUI());
    if (g.custom === "palette"){ body.append(el("p", {className:"hint", textContent:"The slider sets how often each color appears.", style:"margin:0"}), colorList("palette", true)); }
    d.append(body); panel.append(d);
  }
  document.getElementById("seed").value = S.seed;
  const key = S.font+"|"+S.fontWeight;
  if (loaded.has(key)) fontStatus(S.font === "Knewave" && S.fontWeight == 400 ? "Built in, works offline." : `${S.font} loaded from Google Fonts. Needs internet the first time.`);
}

const presetSel = document.getElementById("preset");
presetSel.append(el("option", {value:"", textContent:"Presets…"}));
Object.keys(PRESETS).forEach(n => presetSel.append(el("option", {value:n, textContent:n})));
presetSel.addEventListener("change", () => {
  if (!presetSel.value) return;
  S = Object.assign(clone(BASE), clone(PRESETS[presetSel.value]));
  presetSel.value = ""; buildPanel(); changed();
});
const seedIn = document.getElementById("seed");
seedIn.addEventListener("input", () => { S.seed = Math.floor(+seedIn.value) || 0; changed(); });
function reshuffle(){ S.seed = Math.floor(Math.random()*99999); seedIn.value = S.seed; changed(); }
document.getElementById("shuffle").addEventListener("click", reshuffle);
document.addEventListener("keydown", e => {
  if ((e.key === "r" || e.key === "R") && !e.metaKey && !e.ctrlKey && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) reshuffle();
  if (e.key === "Escape") modal.hidden = true;
});

/* ---------- export ---------- */
const modal = document.getElementById("modal"), exScale = document.getElementById("exScale");
function doExport(){
  const F = frame(), k = +exScale.value;
  const c = document.createElement("canvas"); c.width = Math.round(F.W*k); c.height = Math.round(F.H*k);
  const ctx = c.getContext("2d"); ctx.scale(k,k); render(ctx);
  const url = c.toDataURL("image/png");
  document.getElementById("outImg").src = url;
  const name = `stencil-field-${S.words.split(/[\s,]+/).filter(Boolean).join("-").toLowerCase().slice(0,40)}-${S.seed}.png`;
  const dl = document.getElementById("dl"); dl.href = url; dl.download = name;
  modal.hidden = false;
  // On iPad the share sheet offers Save Image, Files and AirDrop
  const share = document.getElementById("share");
  shareFile = null; share.hidden = true;
  c.toBlob(b => {
    if (!b) return;
    const f = new File([b], name, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { shareFile = f; share.hidden = false; }
  }, "image/png");
}
let shareFile = null;
document.getElementById("share").addEventListener("click", async e => {
  if (!shareFile) return;
  try { await navigator.share({ files: [shareFile], title: "Stencil Field" }); }
  catch (err) { if (err.name !== "AbortError") { e.currentTarget.hidden = true; document.getElementById("saveHint").textContent = "Sharing isn't available here. Long-press the image to save it."; } }
});
document.getElementById("export").addEventListener("click", doExport);
exScale.addEventListener("change", doExport);
document.getElementById("closeModal").addEventListener("click", () => modal.hidden = true);
modal.addEventListener("click", e => { if (e.target === modal) modal.hidden = true; });
document.getElementById("copySettings").addEventListener("click", async e => {
  const b = e.currentTarget, txt = JSON.stringify(S);
  try { await navigator.clipboard.writeText(txt); b.textContent = "Copied"; }
  catch(err) { b.textContent = "Copy failed"; }
  setTimeout(() => b.textContent = "Copy settings", 1400);
});

window.addEventListener("resize", schedule);
document.fonts.addEventListener("loadingdone", () => { mcache.clear(); schedule(); });
buildPanel(); ensureFont(); draw();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
